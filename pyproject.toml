[project]
name = "csv-to-db-py"
version = "0.1.0"
description = "Convert CSV file or folder of CSV to DB with table filled with the CSV data"
readme = "README.md"
authors = [
    {name = "Karim Ounnoughi"},
    {name = "Claude Fauconnet"},
    {name = "Juste Bonzene"}

]
packages = [
    { include = "csv_to_db_py" }
]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "polars>=2.1.0,<3",
    "pandas (>=2.3.2,<3.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "pymysql (>=1.1.0,<2.0.0)",
    "pyodbc (>=5.0.0,<6.0.0)",
    "oracledb (>=2.0.0,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "rich (>=14.1.0,<15.0.0)",
    "fastexcel>=0.20.2",
]


[project.scripts]
csv-to-db = "csv_to_db_py.main:main"
release = "csv_to_db_py.release:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Detected the pattern `.%f` in the chrono format string:",
]

