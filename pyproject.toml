[project]
name = "csv-to-db-py"
version = "0.1.0"
description = "Convert CSV file or folder of CSV to DB with table filled with the CSV data"
readme = "README.md"
authors = [
    {name = "Karim Ounnoughi"},
    {name = "Claude Fauconnet"},
    {name = "Juste Bonzene"}

]
packages = [
    { include = "csv_to_db_py" }
]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "polars>=1.20.0",
    "pandas (>=2.3.2,<3.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "rich (>=14.1.0,<15.0.0)",
    "pyarrow (>=18.0.0,<19.0.0)",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

